name: test
on: [push, pull_request]

# ponytail: geometry only — building mt.jar needs the Android SDK and d8 output isn't
# byte-stable across build-tools versions, so there's no point diffing the committed jar.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./test.sh
